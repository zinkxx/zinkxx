<style>
  svg{--bg:#1a1b27;--bd:#2a2e45;--t:#70a5fd;--l:#38bdae;--v:#c0caf5;--m:#a9b1d6;--ic:#bf91f3;--ac:#f7768e;--tr:#2a2e45}
  @media (prefers-color-scheme: light){svg{--bg:#ffffff;--bd:#d0d7de;--t:#2f6fde;--l:#1a7f72;--v:#24292f;--m:#57606a;--ic:#8250df;--ac:#cf222e;--tr:#eaeef2}}
  .bg{fill:var(--bg);stroke:var(--bd)}
  .t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--t)}
  .l{font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--l)}
  .v{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--v)}
  .s{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--l)}
  .m{font:400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--m)}
  .big{font:700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:var(--t)}
  .ic{fill:var(--ic)} .ac{fill:var(--ac)} .tf{fill:var(--t)}
  .grid{stroke:var(--bd)} .track{fill:var(--tr)} .ring{stroke:var(--t)} .ringac{stroke:var(--ac)} .ringtr{stroke:var(--tr)}
  .fade{opacity:0;animation:in .6s ease-out forwards}
  .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s ease-out forwards}
  .rise{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .8s ease-out forwards}
  @keyframes in{to{opacity:1}} @keyframes grow{to{transform:scaleX(1)}} @keyframes rise{to{transform:scaleY(1)}}
  @media (prefers-reduced-motion: reduce){.fade,.grow,.rise{animation:none;opacity:1;transform:none}}
</style>
