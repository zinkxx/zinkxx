<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Contribution streak">
<title>Contribution streak</title>
<style>
  .t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#70a5fd}
  .l{font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#38bdae}
  .v{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#a9b1d6}
  .s{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#38bdae}
  .big{font:700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#70a5fd}
  .fade{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{to{opacity:1}}
</style>
<rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="#1a1b27" stroke="#2a2e45"/>

<line x1="165" y1="30" x2="165" y2="165" stroke="#2a2e45"/><line x1="330" y1="30" x2="330" y2="165" stroke="#2a2e45"/>
<g class="fade" style="animation-delay:100ms" transform="translate(82.5 0)">
  <text class="big" text-anchor="middle" y="92" style="fill:#70a5fd">9,439</text>
  <text class="l" text-anchor="middle" y="122" style="font-weight:400">Total Contributions</text>
  <text class="s" text-anchor="middle" y="145" style="fill:#a9b1d6;font-size:11px">Apr 2, 2023 – Present</text></g>
<g transform="translate(247.5 0)">
  <circle cy="72" r="40" fill="none" stroke="#f7768e" stroke-width="5"/>
  <path transform="translate(-9 18)" fill="#f7768e" d="M9 0c1 4 7 6 7 12a7 7 0 0 1-14 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4 2-6 2-9Z"/>
</g>
<g class="fade" style="animation-delay:250ms" transform="translate(247.5 0)">
  <text class="big" text-anchor="middle" y="82" style="fill:#f7768e">2</text>
  <text class="l" text-anchor="middle" y="140" style="font-weight:400">Current Streak</text>
  <text class="s" text-anchor="middle" y="160" style="fill:#a9b1d6;font-size:11px">Nov 25, 2026 – Nov 26, 2026</text></g>
<g class="fade" style="animation-delay:400ms" transform="translate(412.5 0)">
  <text class="big" text-anchor="middle" y="92" style="fill:#70a5fd">587</text>
  <text class="l" text-anchor="middle" y="122" style="font-weight:400">Longest Streak</text>
  <text class="s" text-anchor="middle" y="145" style="fill:#a9b1d6;font-size:11px">Jun 23, 2024 – Jan 30, 2026</text></g>
</svg>
